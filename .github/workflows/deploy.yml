# Production deploy on every push to main, via the Vercel CLI.
# Replaces the Vercel GitHub App integration (broken by the org transfer).
#
# Requires the repo secret VERCEL_TOKEN (create at vercel.com/account/tokens).
# Until that secret exists, this workflow skips gracefully.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_yCGDmEBQQrc3JqXBysIOTU1h
      VERCEL_PROJECT_ID: prj_22YGc3PpjMuzqhLsdkPrG6PK2HAa
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy production
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set — skipping deploy (deploys are manual until then)."
            exit 0
          fi
          npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
