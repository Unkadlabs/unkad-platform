# Nightly database backup — the concept note's "single database of record;
# nightly backups" requirement. Dumps the production Neon database and
# stores it as a workflow artifact (30-day retention).
#
# Requires the repo secret NEON_DATABASE_URL (the UNPOOLED connection
# string — pg_dump through the pooler is unreliable).

name: Nightly DB backup

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch: {} # manual runs allowed

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get -y install postgresql-common
          echo | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get -y install postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --format=custom \
            --file="unkad-${STAMP}.dump"
          ls -la unkad-*.dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: unkad-*.dump
          retention-days: 30
